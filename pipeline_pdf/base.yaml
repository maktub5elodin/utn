# Configuración de pandoc común a todos los documentos .md -> PDF del repo.
#
# Cada documento tiene además su propio pdf.yaml, con lo que es solo suyo
# (título, subtítulo, fecha). Pandoc combina los dos archivos: primero este,
# después el del documento (que puede agregar o pisar variables).
#
#   pandoc --defaults=<repo>/pipeline_pdf/base.yaml --defaults=pdf.yaml doc.md
#
# ${.} es la carpeta de este archivo: los filtros se encuentran igual desde
# cualquier materia. Las fuentes (Latin Modern Roman + Latin Modern Math)
# coinciden con las que usan los scripts de figuras (matplotlib + pgf).

from: markdown
to: latex
standalone: true

# El "# Título" del .md pasa a ser el título del documento; "##" -> \section
shift-heading-level-by: -1

table-of-contents: true
toc-depth: 2

# Orden: solo-md y seleccion-catalogo trabajan sobre el contenido del .md;
# tablas-cebra va al final porque convierte las tablas en LaTeX crudo.
filters:
  - ${.}/filtros/solo-md.lua
  - ${.}/filtros/salto-pagina.lua
  - ${.}/filtros/destacados.lua
  - ${.}/filtros/seleccion-catalogo.lua
  - ${.}/filtros/png-a-pdf.lua
  - ${.}/filtros/referencias-fig.lua
  - ${.}/filtros/tablas-cebra.lua

metadata:
  lang: es   # babel spanish: "Figura", "Índice", fecha en español

variables:
  documentclass: article
  # Opción global: xcolor la toma como [table] (carga colortbl y define
  # \rowcolors). Va acá porque el template carga xcolor antes que header-includes.
  # dvipsnames: colores con nombre (ej. BrickRed) que también entiende el
  # MathJax de GitHub, para colorear fórmulas igual en el .md y en el PDF.
  classoption: [table, dvipsnames]
  # Las tablas llegan como LaTeX crudo (filtros/tablas-cebra.lua): pandoc no las
  # detecta, así que se le indica que cargue longtable/booktabs/array igual.
  tables: true
  fontsize: 11pt
  papersize: a4
  geometry: margin=2.5cm
  mainfont: Latin Modern Roman
  mathfont: Latin Modern Math
  colorlinks: true
  linkcolor: blue
  # Figuras fijas en su lugar ([H], paquete float), en el mismo orden que el .md.
  # Con figuras flotantes, una figura pendiente después de una longtable
  # desbordaba la página (Overfull \vbox de ~300 pt, bug conocido de longtable).
  header-includes: |
    \usepackage{float}
    \floatplacement{figure}{H}
    % Título + índice en la primera página; el contenido empieza en página
    % nueva, así el enunciado nunca queda partido.
    \let\indiceoriginal\tableofcontents
    \renewcommand{\tableofcontents}{\indiceoriginal\clearpage}
    % Rayado de cebra en todas las tablas (longtable de pandoc): filas de datos
    % alternadas, empezando por gris. Se aplica solo dentro de longtable para no
    % colorear los array de las fórmulas (cases). El encabezado sin color y los
    % bordes los ajusta filtros/tablas-cebra.lua.
    \usepackage{etoolbox}
    % Recuadros de destacados (filtros/destacados.lua): fondo claro, filete a
    % la izquierda y texto oscuro del mismo tono (las fórmulas toman el color).
    % Rojo = error, verde = respuesta correcta. Centrados y más angostos que el
    % texto, alineados con las ecuaciones centradas; sin cortar palabras ni fórmulas.
    \usepackage[most]{tcolorbox}
    \definecolor{errorfondo}{RGB}{253,237,236}
    \definecolor{errorfilete}{RGB}{192,57,43}
    \definecolor{errortexto}{RGB}{146,43,33}
    \definecolor{correctofondo}{RGB}{233,247,239}
    \definecolor{correctofilete}{RGB}{39,174,96}
    \definecolor{correctotexto}{RGB}{25,111,61}
    \tcbset{destacado/.style={enhanced, breakable, sharp corners,
      boxrule=0pt, leftrule=3pt, left=8pt, right=8pt, top=4pt, bottom=4pt,
      before skip=8pt, after skip=8pt, width=0.8\linewidth, center, halign=center,
      before upper={\hyphenpenalty=10000\exhyphenpenalty=10000
      \binoppenalty=10000\relpenalty=10000}}}
    \newtcolorbox{destacadoerror}{destacado,
      colback=errorfondo, colframe=errorfilete, coltext=errortexto}
    \newtcolorbox{destacadocorrecto}{destacado,
      colback=correctofondo, colframe=correctofilete, coltext=correctotexto}
    \definecolor{cebra}{gray}{0.93}
    % Filas 30 % más altas: las fracciones no tocan la fila vecina.
    \AtBeginEnvironment{longtable}{\rowcolors{1}{cebra}{}\renewcommand{\arraystretch}{1.3}}
    % Caracteres Unicode que Latin Modern Roman no tiene: se dibujan con su
    % equivalente LaTeX. Si aparece uno nuevo, el build se corta (comun.mk) y
    % hay que agregarlo acá.
    \usepackage{newunicodechar}
    \usepackage{fontawesome5}
    \newunicodechar{≈}{\ensuremath{\approx}}
    \newunicodechar{≪}{\ensuremath{\ll}}
    \newunicodechar{►}{\ensuremath{\blacktriangleright}}
    \newunicodechar{✔}{\ensuremath{\checkmark}}
    \newunicodechar{⚠}{\faExclamationTriangle}
    \newunicodechar{₀}{\textsubscript{0}}
    \newunicodechar{₁}{\textsubscript{1}}
